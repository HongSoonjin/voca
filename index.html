<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>소은콕</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2A44">
<style>
:root{--ink:#1F2A44;--paper:#FFFBF0;--card:#fff;--sun:#FFC93C;--mint:#2EC4B6;--coral:#FF6B6B;--mute:#6b7488;--line:#e6dfc9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#F3EFE2;--paper:#161B2B;--card:#222a40;--mute:#a4adc4;--line:#343e5a}}
:root[data-theme="dark"]{--ink:#F3EFE2;--paper:#161B2B;--card:#222a40;--mute:#a4adc4;--line:#343e5a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:30px;margin:8px 0 2px}
.sub{color:var(--mute);margin:0 0 16px;font-size:15px}
.stats{display:flex;gap:10px;margin-bottom:16px}
.stat{flex:1;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px}
.stat span{font-size:13px;color:var(--mute)}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:-4px 0 18px}
.bar i{display:block;height:100%;background:var(--mint);width:0;transition:width .4s}
button{font:inherit;color:inherit;cursor:pointer}
.big{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:16px 18px;margin-bottom:12px;font-size:20px;box-shadow:0 4px 0 var(--ink)}
.big small{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.back{background:none;border:0;font-size:17px;padding:8px 0}
.count{color:var(--mute)}
.flash{background:var(--card);border:2px solid var(--ink);border-radius:26px;padding:28px 18px;text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;box-shadow:0 5px 0 var(--ink)}
.word{font-size:44px;word-break:break-all}
.mean{font-size:30px;color:var(--coral);min-height:42px}
.hint{color:var(--mute);font-size:14px}
.spk{background:var(--sun);border:2px solid var(--ink);border-radius:50%;width:56px;height:56px;font-size:26px}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1;padding:16px;border-radius:16px;border:2px solid var(--ink);font-size:19px}
.no{background:var(--coral);color:#fff}.yes{background:var(--mint);color:#0d2b28}
.opt{display:block;width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin-top:10px;font-size:20px;text-align:left}
.opt.ok{background:var(--mint);border-color:var(--ink);color:#0d2b28}
.opt.bad{background:var(--coral);border-color:var(--ink);color:#fff}
input,textarea{width:100%;font:inherit;font-size:24px;padding:14px;border-radius:14px;border:2px solid var(--ink);background:var(--card);color:var(--ink);text-align:center}
textarea{font-size:16px;text-align:left;height:140px}
.go{background:var(--sun);border:2px solid var(--ink);border-radius:16px;padding:14px;width:100%;font-size:19px;margin-top:12px}
.msg{min-height:34px;text-align:center;font-size:22px;margin-top:10px}
.end{text-align:center;padding:40px 10px}.end .word{font-size:34px}
.chips{display:flex;gap:8px;margin:0 0 16px}.chip{flex:1;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:16px}.chip.on{background:var(--sun);border-color:var(--ink);color:#1F2A44}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:22px;font-size:20px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;margin-top:8px;font-size:15px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const BASE=`school 학교|teacher 선생님|student 학생|classroom 교실|homework 숙제|library 도서관|lesson 수업|question 질문|answer 대답|remember 기억하다|forget 잊다|study 공부하다|learn 배우다|practice 연습하다|understand 이해하다|important 중요한|difficult 어려운|easy 쉬운|different 다른|same 같은|family 가족|friend 친구|neighbor 이웃|brother 형제|sister 자매|parent 부모|grandmother 할머니|breakfast 아침 식사|lunch 점심|dinner 저녁 식사|vegetable 채소|fruit 과일|delicious 맛있는|hungry 배고픈|thirsty 목마른|weather 날씨|sunny 화창한|rainy 비 오는|cloudy 흐린|season 계절|winter 겨울|summer 여름|morning 아침|evening 저녁|yesterday 어제|tomorrow 내일|always 항상|sometimes 가끔|never 결코 ~않다|hobby 취미|music 음악|movie 영화|sport 운동|soccer 축구|swim 수영하다|dance 춤추다|travel 여행하다|airport 공항|station 역|museum 박물관|hospital 병원|restaurant 식당|market 시장|street 거리|beautiful 아름다운|dangerous 위험한|safe 안전한|healthy 건강한|happy 행복한|angry 화난|tired 피곤한|excited 신난|worried 걱정하는|kind 친절한|honest 정직한|brave 용감한|shy 수줍은|smart 똑똑한|borrow 빌리다|lend 빌려주다|choose 고르다|decide 결정하다|invite 초대하다|visit 방문하다|enjoy 즐기다|believe 믿다|wait 기다리다|help 돕다`.split('|').map(s=>{const i=s.indexOf(' ');return{w:s.slice(0,i),m:s.slice(i+1)}});
const HARD=`achieve 달성하다|advantage 장점|advice 조언|afford ~할 여유가 있다|ancient 고대의|appear 나타나다|arrange 정리하다|attend 참석하다|average 평균|avoid 피하다|behavior 행동|benefit 이익|celebrate 기념하다|century 세기|challenge 도전|cheerful 쾌활한|communicate 의사소통하다|compare 비교하다|complain 불평하다|complete 완성하다|concentrate 집중하다|condition 상태|confident 자신 있는|consider 고려하다|contain 포함하다|contest 대회|courage 용기|creative 창의적인|culture 문화|customer 고객|damage 손해|decorate 장식하다|describe 묘사하다|destroy 파괴하다|develop 발전시키다|discover 발견하다|distance 거리|divide 나누다|donate 기부하다|effort 노력|elderly 나이 든|empty 빈|encourage 격려하다|energy 에너지|enough 충분한|environment 환경|equal 동등한|escape 탈출하다|event 행사|exact 정확한|examine 검사하다|experience 경험|explain 설명하다|express 표현하다|familiar 익숙한|festival 축제|foreign 외국의|freedom 자유|garbage 쓰레기|generous 관대한|gentle 온화한|grateful 감사하는|guess 추측하다|habit 습관|harmony 조화|huge 거대한|imagine 상상하다|improve 향상시키다|include 포함하다|increase 증가하다|information 정보|invent 발명하다|journey 여정|knowledge 지식|language 언어|local 지역의|lonely 외로운|manage 관리하다|mention 언급하다|mistake 실수|modern 현대의|necessary 필요한|offer 제안하다|opinion 의견|ordinary 평범한|painful 고통스러운|patient 참을성 있는|perform 공연하다|permit 허락하다|plenty 많음|polite 예의 바른|popular 인기 있는|position 위치|possible 가능한|prepare 준비하다|prevent 막다|private 사적인|produce 생산하다|promise 약속하다|protect 보호하다|proud 자랑스러운|provide 제공하다|public 공공의|recycle 재활용하다|reduce 줄이다|refuse 거절하다|region 지역|relax 휴식하다|rely 의존하다|remain 남다|repeat 반복하다|require 요구하다|rescue 구조하다|respect 존경하다|respond 대답하다|responsible 책임감 있는|result 결과|reward 보상|risk 위험|role 역할|satisfy 만족시키다|scared 무서워하는|serious 심각한|shelter 대피소|similar 비슷한|situation 상황|society 사회|solve 해결하다|spread 퍼지다|stranger 낯선 사람|succeed 성공하다|suggest 제안하다|support 지지하다|surprise 놀라게 하다|survive 살아남다|tradition 전통|useful 유용한|volunteer 자원봉사자|wisdom 지혜|wonder 궁금해하다|worth ~할 가치가 있는`.split('|').map(s=>{const i=s.indexOf(' ');return{w:s.slice(0,i),m:s.slice(i+1),l:2}});
const $=s=>document.querySelector(s),app=$('#app');
let S={xp:0,mute:false,lv:'all',seen:{},box:{},custom:[],streak:0,last:'',today:{d:'',n:0}};
try{const r=localStorage.getItem('vocaS');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('vocaS',JSON.stringify(S))}catch(e){}};
const day=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const words=()=>{const seen={};return BASE.concat(HARD).filter(x=>(S.lv==='all'||(S.lv==='2'?x.l===2:!x.l))&&!seen[x.w]&&(seen[x.w]=1)).concat(S.custom)};
window.setLv=v=>{S.lv=v;save();home()};
const box=w=>S.box[w]||0;
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const GOAL=10,lv=x=>Math.floor((x||0)/100)+1;
const PR_OK=['정답!','좋아!','대박!','굿!','멋져!','완벽!'],PR_NO=['아깝다!','괜찮아, 다시!','다음엔 맞힌다!','힘내자!'];
const pr=a=>a[Math.random()*a.length|0];
let AC;
function sfx(k){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const seq={ok:[[660,0,.12],[880,.1,.18]],combo:[[660,0,.1],[880,.09,.1],[1100,.18,.2]],bad:[[260,0,.12],[200,.12,.22]],done:[[523,0,.12],[659,.12,.12],[784,.24,.12],[1047,.36,.3]]}[k];const t0=AC.currentTime;seq.forEach(([f,t,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=k==='bad'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.001,t0+t);g.gain.exponentialRampToValueAtTime(.18,t0+t+.02);g.gain.exponentialRampToValueAtTime(.001,t0+t+d);o.connect(g);g.connect(AC.destination);o.start(t0+t);o.stop(t0+t+d+.05)})}catch(e){}}
function toast(t,ms){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';document.body.appendChild(e)}e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.style.opacity=0},ms||1100)}
function gain(p){const b=lv(S.xp);S.xp=(S.xp||0)+p;if(lv(S.xp)>b)setTimeout(()=>{sfx('done');toast('🎉 레벨 업! Lv.'+lv(S.xp),2000)},900)}
function newGame(){return{combo:0,best:0,score:0,
  ans(ok){if(ok){this.combo++;this.best=Math.max(this.best,this.combo);const p=10+Math.min(this.combo-1,5)*2;this.score+=p;gain(p);sfx(this.combo>=3?'combo':'ok');toast(this.combo>=2?'🔥 '+this.combo+'콤보! +'+p:pr(PR_OK)+' +'+p)}else{this.combo=0;sfx('bad');toast(pr(PR_NO))}},
  tag(){return '· ⭐'+this.score+(this.combo>1?' 🔥'+this.combo:'')},
  end(){return '점수 '+this.score+'점 · 최고 콤보 '+this.best+' 🔥'}}}
window.toggleMute=()=>{S.mute=!S.mute;save();home()};
const INT=[0,0,1,3,7,14];
const due=w=>{const b=box(w);return b<2||Date.now()-(S.seen[w]||0)>=INT[b]*864e5};
function mark(w,ok,kind,ms){
  if(!ok){S.box[w]=0;S.seen[w]=Date.now()}
  else if(kind!=='card'&&due(w)){S.box[w]=Math.min(5,box(w)+1);S.seen[w]=Date.now()}
  const t=day();
  if(S.today.d!==t||!S.today.ws)S.today={d:t,n:0,ws:{}};
  S.today.ws[w]=1;S.today.n=Object.keys(S.today.ws).length;
  if(ms&&ok&&kind!=='card'){S.today.ms=S.today.ms||{};S.today.ms[w]=1;S.today.mn=Object.keys(S.today.ms).length}
  if((S.today.mn||0)>=GOAL&&!S.today.done){S.today.done=1;S.xp=(S.xp||0)+30;setTimeout(()=>{sfx('done');toast('🎯 오늘의 미션 완료! +30XP',2200)},1400)}
  if(S.last!==t){const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();S.streak=S.last===ys?S.streak+1:1;S.last=t}
  save();
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function pick(n,only){ // weakest boxes first, random within box
  const all=shuffle(only===true?S.custom:only?S.custom.filter(c=>gname(c)===only):words());all.sort((a,b)=>(due(b.w)-due(a.w))||(box(a.w)-box(b.w)));return shuffle(all.slice(0,n));
}
function home(){
  const t=day(),n=S.today.d===t?S.today.n:0,mn=S.today.d===t?(S.today.mn||0):0,known=words().filter(x=>box(x.w)>=4).length,tot=words().length;
  app.innerHTML=`<h1>소은콕 📌</h1><p class="sub">하루 10분, 콕콕 외우자!</p>
  <div class="stat" style="text-align:left;margin-bottom:10px"><div style="display:flex;justify-content:space-between"><b style="display:inline;font-size:20px">Lv.${lv(S.xp)} ⭐</b><span>${(S.xp||0)%100}/100 XP</span></div><div class="bar" style="margin:6px 0 0"><i style="width:${(S.xp||0)%100}%;background:var(--sun)"></i></div></div>
  <div class="stat" style="text-align:left;margin-bottom:14px"><div>🎯 오늘의 미션: 내 단어 ${GOAL}개 맞히기 ${S.today.d===t&&S.today.done?'✅':''}</div><div class="bar" style="margin:6px 0 4px"><i style="width:${Math.min(100,mn/GOAL*100)}%"></i></div><span>${Math.min(mn,GOAL)}/${GOAL} · 퀴즈·쓰기로 맞혀야 올라가요 · +30 XP${S.custom.length?'':' · 먼저 "내 단어 추가"에서 단어를 넣어 주세요'}</span></div>
  <div class="stats"><div class="stat"><b>${S.last===t||S.streak?S.streak:0}일</b><span>연속 학습</span></div><div class="stat"><b>${n}</b><span>오늘 푼 단어</span></div><div class="stat"><b>${known}/${tot}</b><span>외운 단어</span></div></div>
  <div class="bar"><i style="width:${known/tot*100}%"></i></div>
  <div class="chips">${[['all','전체'],['1','기본'],['2','심화']].map(([v,t])=>`<button class="chip${S.lv===v?' on':''}" onclick="setLv('${v}')">${t}</button>`).join('')}</div>
  <button class="big" onclick="cards()">🃏 단어 카드<small>듣고, 뒤집고, 알아요/몰라요</small></button>
  <button class="big" onclick="folders()">⭐ 내 단어 공부<small>폴더별로 골라서 공부 (${S.custom.length}개)</small></button>
  <button class="big" onclick="quiz()">🎯 뜻 맞히기 퀴즈<small>발음 듣고 4개 중 고르기</small></button>
  <button class="big" onclick="spell()">✏️ 스펠링 쓰기<small>소리를 듣고 직접 써보기</small></button>
  <button class="big" onclick="addw()">➕ 내 단어 추가<small>학원·교과서 단어 넣기</small></button>
  <div style="text-align:center"><button class="link" onclick="toggleMute()">${S.mute?'🔇 효과음 꺼짐 (누르면 켜짐)':'🔊 효과음 켜짐 (누르면 꺼짐)'}</button></div>`;
}
const head=(t,i,n,x)=>`<div class="top"><button class="back" onclick="home()">← 처음으로</button><span class="count">${t} ${i+1}/${n} ${x||''}</span></div>`;
function done(msg,sub){app.innerHTML=`<div class="end"><div class="word">🎉</div><h1>${msg}</h1><p class="sub">${sub||'틀린 단어는 다음에 더 자주 나와요.'}</p><button class="go" onclick="home()">처음으로</button></div>`}
function cards(only){
  if(only&&!S.custom.length){alert('아직 추가한 단어가 없어요. "내 단어 추가"에서 먼저 넣어주세요.');return}
  const q=pick(10,only);let i=0,flip=false;
  const show=()=>{
    if(i>=q.length)return done('카드 끝!','퀴즈·스펠링에서 맞혀야 "외운 단어"가 돼요.');
    const c=q[i];
    app.innerHTML=head('카드',i,q.length)+`<div class="flash" onclick="flipC()"><div class="word">${c.w}</div><button class="spk" onclick="event.stopPropagation();speak('${c.w}')">🔊</button><div class="mean" id="m">${flip?c.m:''}</div><div class="hint">${flip?'':'카드를 눌러 뜻 보기'}</div></div>
    <div class="row"><button class="no" onclick="ans(false)">몰라요 😵</button><button class="yes" onclick="ans(true)">알아요 😎</button></div>`;
    if(!flip)speak(c.w);
  };
  window.flipC=()=>{flip=true;show()};
  window.ans=ok=>{gain(ok?3:1);sfx(ok?'ok':'bad');mark(q[i].w,ok,'card',!!only);i++;flip=false;show()};
  show();
}
function quiz(only){
  const q=pick(10,only);let i=0,ok=0;const G=newGame();
  const show=()=>{
    if(i>=q.length){sfx('done');return done(`${ok}/${q.length} 정답!`,G.end())}
    const c=q[i],opts=shuffle([c].concat(shuffle(words().filter(x=>x.w!==c.w)).slice(0,3)));
    app.innerHTML=head('퀴즈',i,q.length,G.tag())+`<div class="flash"><div class="word">${c.w}</div><button class="spk" onclick="speak('${c.w}')">🔊</button></div>`+opts.map((o,k)=>`<button class="opt" onclick="pk(${k},this)">${o.m}</button>`).join('');
    window.pk=(k,el)=>{
      const right=opts[k].w===c.w;
      document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(opts[j].w===c.w)b.classList.add('ok')});
      if(!right)el.classList.add('bad');else ok++;
      G.ans(right);mark(c.w,right,'quiz',!!only);i++;setTimeout(show,right?600:1400);
    };
    speak(c.w);
  };
  show();
}
function spell(only){
  const q=pick(8,only);let i=0;const G=newGame();
  const show=()=>{
    if(i>=q.length){sfx('done');return done('스펠링 끝!',G.end())}
    const c=q[i];
    app.innerHTML=head('스펠링',i,q.length,G.tag())+`<div class="flash"><button class="spk" onclick="speak('${c.w}')">🔊</button><div class="mean">${c.m}</div><div class="hint">소리를 듣고 영어로 써보세요</div></div>
    <div style="margin-top:14px"><input id="t" autocomplete="off" autocapitalize="none" spellcheck="false"><button class="go" onclick="chk()">확인</button><div class="msg" id="r"></div></div>`;
    speak(c.w);
    $('#t').addEventListener('keydown',e=>{if(e.key==='Enter')chk()});
  };
  window.chk=()=>{
    const c=q[i],v=$('#t').value.trim().toLowerCase(),r=$('#r');
    if(!v)return;
    const ok=v===c.w.toLowerCase();
    r.textContent=ok?'⭕ 정답!':'❌ 정답: '+c.w;r.style.color=ok?'var(--mint)':'var(--coral)';
    $('#t').disabled=true;G.ans(ok);mark(c.w,ok,'spell',!!only);i++;setTimeout(show,ok?700:1800);
  };
  show();
}
const gname=c=>c.g||'내 단어';
const groups=()=>{const m={};S.custom.forEach((c,k)=>{(m[gname(c)]=m[gname(c)]||[]).push(k)});return Object.entries(m)};
window.gcards=gi=>cards(groups()[gi][0]);
window.gquiz=gi=>quiz(groups()[gi][0]);
window.gspell=gi=>spell(groups()[gi][0]);
function folders(){
  const gs=groups();
  if(!gs.length){alert('아직 추가한 단어가 없어요. "내 단어 추가"에서 먼저 넣어주세요.');return}
  app.innerHTML=`<div class="top"><button class="back" onclick="home()">← 처음으로</button></div><h1>내 단어 공부</h1><p class="sub">공부할 폴더를 골라요</p><button class="big" onclick="cards(true)">📚 전체 폴더<small>${S.custom.length}개 단어를 섞어서</small></button>`+gs.map(([g,ks],gi)=>`<div style="margin-bottom:14px"><button class="big" style="margin:0 0 6px" onclick="gcards(${gi})">📁 ${g.replace(/</g,'&lt;')}<small>${ks.length}개 · 카드로 공부</small></button><div style="display:flex;gap:14px;padding-left:6px"><button class="link" style="margin:0" onclick="gquiz(${gi})">🎯 퀴즈</button><button class="link" style="margin:0" onclick="gspell(${gi})">✏️ 쓰기</button></div></div>`).join('');
}
const OPEN={};
const refresh=()=>{const e=$('#gl');if(e)e.innerHTML=groupsHtml()};
function groupsHtml(){
  const gs=groups();
  return `<p class="sub" style="margin-top:18px">추가한 단어 ${S.custom.length}개 · 폴더 ${gs.length}개</p>`+gs.map(([g,ks],gi)=>{
    const o=OPEN[g],nm=g.replace(/</g,'&lt;');
    return `<div style="margin-bottom:10px"><button class="big" style="margin:0;padding:14px 16px;font-size:19px;display:flex;align-items:center;gap:8px" onclick="tg(${gi})"><span>${o?'📂':'📁'}</span><b style="flex:1;font-weight:normal">${nm}</b><span class="count" style="font-size:15px">${ks.length}개 ${o?'▾':'▸'}</span></button>`+(o?`<div style="padding:10px 2px 0"><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px"><button class="link" style="margin:0" onclick="gcards(${gi})">📖 카드</button><button class="link" style="margin:0" onclick="gquiz(${gi})">🎯 퀴즈</button><button class="link" style="margin:0" onclick="gspell(${gi})">✏️ 쓰기</button><button class="link" style="margin:0;color:var(--coral)" onclick="gdel(${gi})">폴더 삭제</button></div>`+ks.map(k=>{const c=S.custom[k];return `<div class="stat" style="display:flex;align-items:center;gap:8px;margin:8px 0 0;text-align:left"><button class="spk" style="width:40px;height:40px;font-size:18px" onclick="speak('${c.w}')">🔊</button><span style="flex:1"><b style="display:inline;font-size:18px">${c.w}</b> ${c.m}</span><button class="link" style="margin:0" onclick="del(${k})">삭제</button></div>`}).join('')+`</div>`:'')+`</div>`}).join('');
}
function cleanLine(l){
  l=l.replace(/[|\t]+/g,' ').replace(/^[\s\d.)\-•*]+/,'');
  const m=l.match(/^([A-Za-z][A-Za-z'-]*(?:\s+[A-Za-z][A-Za-z'-]*)*)\s*(.*)$/);if(!m)return '';
  let k=m[2].replace(/[^가-힣~,.()·\/\s]/g,' ').replace(/\s+/g,' ').trim();
  const t=k.split(' ').filter(Boolean),one=t.filter(x=>/^[가-힣]$/.test(x)).length;
  if(t.length>1&&one/t.length>=.5)k=k.replace(/([가-힣~])\s+(?=[가-힣])/g,'$1');
  k=k.replace(/^[,.·\s]+|[,.\s]+$/g,'');
  return /[가-힣]/.test(k)?m[1]+' '+k:'';
}
function prep(file){return new Promise(res=>{const im=new Image();im.onload=()=>{try{const sc=Math.min(2.5,2200/Math.max(im.width,1));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);const g=c.getContext('2d');g.drawImage(im,0,0,c.width,c.height);const d=g.getImageData(0,0,c.width,c.height),a=d.data;for(let i=0;i<a.length;i+=4){let v=a[i]*.3+a[i+1]*.59+a[i+2]*.11;v=Math.max(0,Math.min(255,(v-110)*1.6+110));a[i]=a[i+1]=a[i+2]=v}g.putImageData(d,0,0);c.toBlob(b=>res(b||file),'image/png')}catch(e){res(file)}};im.onerror=()=>res(file);im.src=URL.createObjectURL(file)})}
function addw(){
  app.innerHTML=`<div class="top"><button class="back" onclick="home()">← 처음으로</button></div><h1>내 단어 추가</h1><p class="sub">한 줄에 하나씩, “영어 뜻” 형식으로 써주세요.<br>예) apple 사과</p><button class="go" style="background:var(--mint);margin:0 0 8px" onclick="$('#ph').click()">📷 사진에서 단어 읽기</button><input type="file" id="ph" accept="image/*" hidden><div class="msg" id="st" style="font-size:15px;min-height:22px;margin:0 0 8px"></div><input id="gn" placeholder="그룹 이름 (예: 3과, 학원 단어)" style="font-size:18px;margin-bottom:8px"><textarea id="ta" placeholder="apple 사과&#10;banana 바나나"></textarea><button class="go" onclick="addSave()">저장하기</button><div class="msg" id="r"></div><div id="gl">${groupsHtml()}</div>`;
  window.tg=gi=>{const g=groups()[gi][0];OPEN[g]=!OPEN[g];refresh()};
  window.del=k=>{S.custom.splice(k,1);save();refresh()};
  window.ocr=async f=>{
    const st=$('#st');if(!f)return;
    st.textContent='글자 읽는 중… (처음엔 1~2분 걸려요)';
    try{
      if(!window.Tesseract)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
      const img=await prep(f);
      const lg={logger:m=>{if(m.progress)st.textContent='읽는 중… '+Math.round(m.progress*100)+'%'}};
      let text;
      const run=async lp=>{const w=await Tesseract.createWorker('eng+kor',1,Object.assign({},lg,lp?{langPath:lp}:{}));try{await w.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'})}catch(e){}const r=await w.recognize(img);await w.terminate();return r.data.text};
      try{text=await run('https://tessdata.projectnaptha.com/4.0.0_best')}catch(e2){text=await run()}
      const out=text.split('\n').map(cleanLine).filter(Boolean);
      const ta=$('#ta');ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+out.join('\n');
      st.textContent=out.length?out.length+'줄을 찾았어요. 한글이 이상하면 구글 렌즈로 복사해 붙여넣는 게 더 정확해요. 고친 뒤 저장하세요!':'단어를 못 찾았어요. 글자가 크게 나오게 다시 찍어보세요.';
    }catch(e){st.textContent='읽기에 실패했어요. 인터넷 연결을 확인해 주세요.'}
  };
  $('#ph').onchange=e=>{ocr(e.target.files[0]);e.target.value=''};
  window.addSave=()=>{
    let n=0;const g=$('#gn').value.trim()||(new Date().getMonth()+1)+'/'+new Date().getDate()+' 추가';
    $('#ta').value.split('\n').forEach(l=>{l=l.trim();const mm=l.match(/^([A-Za-z][A-Za-z'.-]*(?:\s+[A-Za-z][A-Za-z'.-]*)*)\s+(\S.*)$/);if(mm){const w=mm[1],m=mm[2].trim();if(m&&!words().some(x=>x.w===w)){S.custom.push({w,m,g});n++}}});
    save();addw();$('#r').textContent=n+'개 저장했어요!';
  };
  window.gcards=gi=>cards(groups()[gi][0]);
  window.gquiz=gi=>quiz(groups()[gi][0]);
  window.gspell=gi=>spell(groups()[gi][0]);
  window.gdel=gi=>{const [g,ks]=groups()[gi];if(confirm('"'+g+'" 그룹의 단어 '+ks.length+'개를 모두 지울까요?')){S.custom=S.custom.filter(c=>gname(c)!==g);save();refresh()}};
}
home();
</script>
