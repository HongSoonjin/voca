<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>소은콕</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2A44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#1F2A44;--paper:var(--tl,#FFFBF0);--card:#fff;--sun:#FFC93C;--mint:#2EC4B6;--coral:#FF6B6B;--mute:#6b7488;--line:#e6dfc9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#F3EFE2;--paper:var(--td,#161B2B);--card:#222a40;--mute:#a4adc4;--line:#343e5a}}
:root[data-theme="dark"]{--ink:#F3EFE2;--paper:var(--td,#161B2B);--card:#222a40;--mute:#a4adc4;--line:#343e5a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{transition:background .6s;margin:0;background:var(--paper);color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:30px;margin:8px 0 2px}
.brand{display:flex;align-items:center;gap:12px;margin:4px 0 14px}.brand img{width:70px;height:70px;border-radius:16px;flex:none}.brand h1{margin:0}.brand .sub{margin:2px 0 0}
.sub{color:var(--mute);margin:0 0 16px;font-size:15px}
.stats{display:flex;gap:10px;margin-bottom:16px}
.stat{flex:1;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px}
.stat span{font-size:13px;color:var(--mute)}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:-4px 0 18px}
.bar i{display:block;height:100%;background:var(--mint);width:0;transition:width .4s}
button{font:inherit;color:inherit;cursor:pointer}
.big{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:16px 18px;margin-bottom:12px;font-size:20px;box-shadow:0 4px 0 var(--ink)}
.big small{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.back{background:none;border:0;font-size:17px;padding:8px 0}
.count{color:var(--mute)}
.flash{background:var(--card);border:2px solid var(--ink);border-radius:26px;padding:28px 18px;text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;box-shadow:0 5px 0 var(--ink)}
.word{font-size:44px;word-break:break-all}
.mean{font-size:30px;color:var(--coral);min-height:42px}
.hint{color:var(--mute);font-size:14px}
.spk{background:var(--sun);border:2px solid var(--ink);border-radius:50%;width:56px;height:56px;font-size:26px}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1;padding:16px;border-radius:16px;border:2px solid var(--ink);font-size:19px}
.no{background:var(--coral);color:#fff}.yes{background:var(--mint);color:#0d2b28}
.opt{display:block;width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin-top:10px;font-size:20px;text-align:left}
.opt.ok{background:var(--mint);border-color:var(--ink);color:#0d2b28}
.opt.bad{background:var(--coral);border-color:var(--ink);color:#fff}
input,textarea{width:100%;font:inherit;font-size:24px;padding:14px;border-radius:14px;border:2px solid var(--ink);background:var(--card);color:var(--ink);text-align:center}
textarea{font-size:16px;text-align:left;height:140px}
.go{background:var(--sun);border:2px solid var(--ink);border-radius:16px;padding:14px;width:100%;font-size:19px;margin-top:12px}
.msg{min-height:34px;text-align:center;font-size:22px;margin-top:10px}
.end{text-align:center;padding:40px 10px}.end .word{font-size:34px}
.chips{display:flex;gap:8px;margin:0 0 16px}.chip{flex:1;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:16px}.chip.on{background:var(--sun);border-color:var(--ink);color:#1F2A44}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:22px;font-size:20px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.wtag{background:var(--coral);color:#fff;border-radius:14px;padding:4px 12px;font-size:14px}
.mic{display:block;width:100%;margin-top:12px;padding:14px;border-radius:16px;border:2px solid var(--ink);background:var(--card);font-size:18px}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;margin-top:8px;font-size:15px}
</style>
</head>
<body>
<main id="app"></main>

let S={wrong:{},cfg:null,dirty:false,lastSync:0,xp:0,mute:false,lv:'all',seen:{},box:{},custom:[],streak:0,last:'',today:{d:'',n:0}};
try{const r=localStorage.getItem('vocaS');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('vocaS',JSON.stringify(S))}catch(e){}};
const day=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const words=()=>{const seen={};return BASE.concat(HARD).filter(x=>(S.lv==='all'||(S.lv==='2'?x.l===2:!x.l))&&!seen[x.w]&&(seen[x.w]=1)).concat(S.custom)};
window.setLv=v=>{S.lv=v;save();home()};
const box=w=>S.box[w]||0;

function cleanLine(l){

  if(t.length>1&&one/t.length>=.5)k=k.replace(/([가-힣~])\s+(?=[가-힣])/g,'$1');

  return /[가-힣]/.test(k)?m[1]+' '+k:'';
}

      const lg={logger:m=>{if(m.progress)st.textContent='읽는 중… '+Math.round(m.progress*100)+'%'}};
      let text;
      const run=async lp=>{const w=await Tesseract.createWorker('eng+kor',1,Object.assign({},lg,lp?{langPath:lp}:{}));try{await w.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'})}catch(e){}const r=await w.recognize(img);await w.terminate();return r.data.text};
      try{text=await run('https://tessdata.projectnaptha.com/4.0.0_best')}catch(e2){text=await run()}
      const out=text.split('\n').map(cleanLine).filter(Boolean);
      const ta=$('#ta');ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+out.join('\n');
      st.textContent=out.length?out.length+'줄을 찾았어요. 한글이 이상하면 구글 렌즈로 복사해 붙여넣는 게 더 정확해요. 고친 뒤 저장하세요!':'단어를 못 찾았어요. 글자가 크게 나오게 다시 찍어보세요.';
    }catch(e){st.textContent='읽기에 실패했어요. 인터넷 연결을 확인해 주세요.'}
  };
  $('#ph').onchange=e=>{ocr(e.target.files[0]);e.target.value=''};
  window.addSave=()=>{
    let n=0;const g=$('#gn').value.trim()||(new Date().getMonth()+1)+'/'+new Date().getDate()+' 추가';
    $('#ta').value.split('\n').forEach(l=>{l=l.trim();const mm=l.match(/^([A-Za-z][A-Za-z'.-]*(?:\s+[A-Za-z][A-Za-z'.-]*)*)\s+(\S.*)$/);if(mm){const w=mm[1],m=mm[2].trim();if(m&&!words().some(x=>x.w===w)){S.custom.push({w,m,g});n++}}});
    save();addw();$('#r').textContent=n+'개 저장했어요!';
  };
  window.gcards=gi=>cards(groups()[gi][0]);
  window.gquiz=gi=>quiz(groups()[gi][0]);
  window.gspell=gi=>spell(groups()[gi][0]);
  window.gdel=gi=>{const [g,ks]=groups()[gi];if(confirm('"'+g+'" 그룹의 단어 '+ks.length+'개를 모두 지울까요?')){S.custom=S.custom.filter(c=>gname(c)!==g);save();refresh()}};
}
home();
if(S.dirty)setTimeout(doSync,1500);
try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
